name: Update betting-site news

on:
  # 16:00 UTC = 日本時間 翌01:00
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
  # GitHub上でファイルを追加・修正したときにも再生成・再公開する
  push:
    branches:
      - main
    paths-ignore:
      - 'data/news.json'

concurrency:
  group: betting-site-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Inspect Minnano Keirin article delivery
        run: python scripts/probe_minnano.py
      - name: Collect site topics and build static HTML
        run: python scripts/build.py --output site --snapshot data/news.json
      - name: Persist last fetched data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "chore: update betting-site news snapshot"
            # Manual source edits may land during long image downloads.
            # Rebase generated data on the latest main without force-pushing.
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase -X theirs "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              sleep 2
            done
            echo "Could not persist the snapshot after 3 safe retries" >&2
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
